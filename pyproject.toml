[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-structure-engine"
version = "0.1.0"
description = "A modular, explainable Wyckoff/market-structure analysis engine for equity screening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MSE Team" }]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.10",
    "yfinance>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",   # 强制分层依赖 (Engine 层禁 import LLM)
    "ruff>=0.6",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

# ── 分层依赖契约 (对应 Spec 红线: Engine 层零 LLM) ───────────────
# 运行 `lint-imports` 校验; 违反即 CI 失败。
[tool.importlinter]
root_package = "mse"

[[tool.importlinter.contracts]]
name = "Engine core must not depend on LLM/news services"
type = "forbidden"
source_modules = [
    "mse.data",
    "mse.wyckoff",
    "mse.scoring",
    "mse.scanner",
]
forbidden_modules = [
    "mse.services",
]

[[tool.importlinter.contracts]]
name = "Layered architecture (top depends on bottom, never reverse)"
type = "layers"
layers = [
    "mse.agent",
    "mse.reporting",
    "mse.ranking",
    "mse.analysis",
    "mse.scanner",
    "mse.scoring",
    "mse.wyckoff",
    "mse.data",
    "mse.core",
]
